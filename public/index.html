<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সুরক্ষিত নাগরিক রিপোর্টিং পোর্টাল</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-gray-800 rounded-xl shadow-2xl p-6 border border-gray-700">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-red-500 mb-2">🚨 মাদকবিরোধী নাগরিক পোর্টাল</h1>
            <p class="text-sm text-gray-400">আপনার পরিচয় সম্পূর্ণ গোপন থাকবে। সঠিক তথ্য দিয়ে সহযোগিতা করুন।</p>
        </div>

        <form id="reportForm" class="space-y-4" enctype="multipart/form-data">
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">অপরাধের ধরন সিলেক্ট করুন</label>
                <select name="category" required class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-red-500">
                    <option value="">বাছাই করুন...</option>
                    <option value="মাদক কেনাবেচা / খুচরা বিক্রয়">মাদক কেনাবেচা / খুচরা বিক্রয়</option>
                    <option value="মাদক মজুদ / গোডাউন">মাদক মজুদ / গোডাউন</option>
                    <option value="মাদক চোরাচালান / রুট">মাদক চোরাচালান / রুট</option>
                    <option value="অন্যান্য অপরাধমূলক কর্মকাণ্ড">অন্যান্য অপরাধমূলক কর্মকাণ্ড</option>
                </select>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">সুনির্দিষ্ট এলাকা বা ঠিকানা</label>
                <input type="text" name="location" required placeholder="উদা: রোড নং-৪, ব্লক-ডি, পল্লবী, মিরপুর" 
                    class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-red-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">বিস্তারিত বিবরণ (যদি থাকে)</label>
                <textarea name="description" rows="3" placeholder="অপরাধের সময়, নির্দিষ্ট স্পট বা সন্দেহভাজনদের সম্পর্কে বিস্তারিত লিখুন..." 
                    class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-red-500"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">ছবি বা প্রমাণ সংযুক্ত করুন (ঐচ্ছিক)</label>
                <input type="file" name="reportImage" accept="image/*" 
                    class="w-full bg-gray-700 border border-gray-600 rounded-lg px-2 py-1 text-sm text-gray-400 file:mr-4 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-red-500 file:text-white hover:file:bg-red-600">
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 px-4 rounded-lg transition duration-200 mt-2 cursor-pointer shadow-lg">
                নিরাপদে রিপোর্ট সাবমিট করুন
            </button>
        </form>

        <div id="responseMessage" class="mt-4 p-3 rounded-lg text-sm text-center hidden"></div>
    </div>

    <script>
        document.getElementById('reportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const form = e.target;
            const submitBtn = document.getElementById('submitBtn');
            const responseMessage = document.getElementById('responseMessage');
            
            // বাটন ডিজেবল করা (যাতে বারবার ক্লিক না হয়)
            submitBtn.disabled = true;
            submitBtn.innerText = "প্রসেস হচ্ছে...";
            
            responseMessage.classList.add('hidden');
            
            const formData = new FormData(form);
            
            try {
                const response = await fetch('/api/submit-report', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                responseMessage.classList.remove('hidden');
                if (response.ok) {
                    responseMessage.className = "mt-4 p-3 rounded-lg text-sm text-center bg-green-900/50 border border-green-600 text-green-300";
                    responseMessage.innerText = result.message;
                    form.reset(); // ফর্ম খালি করা
                } else {
                    responseMessage.className = "mt-4 p-3 rounded-lg text-sm text-center bg-red-900/50 border border-red-600 text-red-300";
                    responseMessage.innerText = result.error || "কোনো সমস্যা হয়েছে।";
                }
            } catch (error) {
                responseMessage.classList.remove('hidden');
                responseMessage.className = "mt-4 p-3 rounded-lg text-sm text-center bg-red-900/50 border border-red-600 text-red-300";
                responseMessage.innerText = "সার্ভারের সাথে যোগাযোগ করা যাচ্ছে না।";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "নিরাপদে রিপোর্ট সাবমিট করুন";
            }
        });
    </script>
</body>
</html>
