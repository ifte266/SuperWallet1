<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Safety Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-slate-900 border border-slate-700 p-8 rounded-3xl shadow-2xl">
    <h1 class="text-2xl font-bold text-center text-red-500 mb-6">🚨 নিরাপত্তা পোর্টাল</h1>
    
    <form id="reportForm" class="space-y-4">
        <select id="category" class="w-full bg-slate-800 p-4 rounded-xl border border-slate-700">
            <option>মাদক কেনাবেচা</option>
            <option>চুরি / ছিনতাই</option>
            <option>ইভটিজিং</option>
            <option>সন্দেহভাজন কার্যক্রম</option>
        </select>
        
        <input type="text" id="location" placeholder="এলাকার নাম" class="w-full bg-slate-800 p-4 rounded-xl border border-slate-700">
        <textarea id="details" placeholder="বিস্তারিত বিবরণ (ঐচ্ছিক)" class="w-full bg-slate-800 p-4 rounded-xl border border-slate-700"></textarea>
        
        <input type="file" id="fileUpload" class="w-full p-2 bg-slate-800 rounded-xl border border-slate-700">
        
        <button type="submit" id="submitBtn" class="w-full bg-red-600 hover:bg-red-700 py-4 rounded-xl font-bold transition">রিপোর্ট পাঠান</button>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAGeR82VjAse0w3P-Bdd0uzrTGrq02ffXc",
        authDomain: "citizen-safety-tracker.firebaseapp.com",
        projectId: "citizen-safety-tracker",
        storageBucket: "citizen-safety-tracker.firebasestorage.app",
        messagingSenderId: "871704315412",
        appId: "1:871704315412:web:b30edabcfc719abff1c901"
    };

    initializeApp(firebaseConfig);
    const storage = getStorage();

    document.getElementById('reportForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerText = "পাঠানো হচ্ছে...";
        btn.disabled = true;

        let fileUrl = "ছবি সংযুক্ত করা হয়নি";
        const file = document.getElementById('fileUpload').files[0];

        try {
            if(file) {
                const storageRef = ref(storage, 'reports/' + Date.now() + '.jpg');
                const snapshot = await uploadBytes(storageRef, file);
                fileUrl = await getDownloadURL(snapshot.ref);
            }

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const text = `🚨 *নতুন রিপোর্ট*\n*ধরন:* ${document.getElementById('category').value}\n*এলাকা:* ${document.getElementById('location').value}\n*বিবরণ:* ${document.getElementById('details').value}\n*ছবি:* ${fileUrl}\n*লোকেশন:* ${pos.coords.latitude}, ${pos.coords.longitude}`;
                
                await fetch(`https://api.telegram.org/bot8868947145:AAFjXyUwInMs1bGzhEvV9Oyla1eGkaKbbVg/sendMessage?chat_id=8766925591&text=${encodeURIComponent(text)}&parse_mode=Markdown`);
                
                alert("আপনার রিপোর্টটি সফলভাবে পাঠানো হয়েছে!");
                location.reload();
            }, () => {
                alert("দয়া করে লোকেশন পারমিশন অন করুন।");
                btn.disabled = false;
                btn.innerText = "রিপোর্ট পাঠান";
            });
        } catch (error) {
            alert("সিস্টেম এরর, আবার চেষ্টা করুন।");
            btn.disabled = false;
            btn.innerText = "রিপোর্ট পাঠান";
        }
    });
</script>
</body>
</html>
