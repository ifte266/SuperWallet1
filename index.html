<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Safety Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href='data:application/json,{"name":"Citizen Safety Tracker","short_name":"SafetyTracker","start_url":"./","display":"standalone","background_color":"#000000","theme_color":"#000000","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2991/2991148.png","sizes":"192x192","type":"image/png"}]}'>
</head>
<body class="bg-black text-white min-h-screen p-4">

    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold mb-6">Citizen Safety Tracker</h1>
        
        <div id="installContainer" class="hidden mb-6">
            <button id="installBtn" class="w-full bg-green-600 py-3 rounded-lg font-bold">Install App to Home Screen</button>
        </div>

        <div class="bg-[#1a1a1a] p-6 rounded-2xl shadow-xl">
            <form id="reportForm" class="flex flex-col gap-4">
                <select id="category" class="w-full bg-[#2a2a2a] p-4 rounded-lg text-white border border-gray-700 focus:outline-none">
                    <option value="Drug Activity">Drug Activity</option>
                    <option value="Theft">Theft/Robbery</option>
                    <option value="Public Harassment">Public Harassment</option>
                    <option value="Traffic Violation">Traffic Violation</option>
                    <option value="Environmental Issue">Environmental Issue</option>
                    <option value="Suspicious Activity">Suspicious Activity</option>
                    <option value="Other">Other</option>
                </select>
                <button type="submit" class="w-full bg-blue-600 py-4 rounded-lg font-bold text-lg hover:bg-blue-700 transition">Submit Report</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAGeR82VjAse0w3P-Bdd0uzrTGrq02ffXc",
            authDomain: "citizen-safety-tracker.firebaseapp.com",
            projectId: "citizen-safety-tracker",
            storageBucket: "citizen-safety-tracker.firebasestorage.app",
            messagingSenderId: "871704315412",
            appId: "1:871704315412:web:b30edabcfc719abff1c901"
        };
        initializeApp(firebaseConfig);

        const BOT_TOKEN = "8868947145:AAFjXyUwInMs1bGzhEvV9Oyla1eGkaKbbVg";
        const CHAT_ID = "8766925591";

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            document.getElementById('installContainer').classList.remove('hidden');
            window.deferredPrompt = e;
        });

        document.getElementById('installBtn').addEventListener('click', () => {
            if (window.deferredPrompt) {
                window.deferredPrompt.prompt();
                document.getElementById('installContainer').classList.add('hidden');
            }
        });

        document.getElementById('reportForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const cat = document.getElementById('category').value;
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const text = `🚨 *Report: ${cat}*%0A📍 *Location:* ${pos.coords.latitude}, ${pos.coords.longitude}%0A🔗 *Map:* https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${text}&parse_mode=Markdown`);
                alert("Report Sent Successfully!");
            }, () => alert("Location permission is mandatory."));
        });
    </script>
</body>
</html>
