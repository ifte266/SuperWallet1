<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>নিরাপত্তা পোর্টাল</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; min-height: 100vh; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="flex flex-col items-center py-6 px-4">

<div class="w-full max-w-sm glass p-6 rounded-3xl shadow-2xl">
    <h1 class="text-2xl font-bold text-center text-red-500 mb-6">🚨 নিরাপত্তা পোর্টাল</h1>
    
    <form id="reportForm" class="space-y-4">
        <select id="category" class="w-full bg-slate-800 p-3 rounded-xl border border-slate-700 text-white">
            <option>চুরি / ছিনতাই</option>
            <option>মাদক কেনাবেচা</option>
            <option>ইভটিজিং</option>
            <option>সন্দেহভাজন কার্যক্রম</option>
        </select>
        
        <input type="text" id="location" placeholder="এলাকার নাম" required class="w-full bg-slate-800 p-3 rounded-xl border border-slate-700 text-white">
        
        <button type="button" id="voiceBtn" class="w-full bg-slate-700 hover:bg-slate-600 py-2 rounded-xl text-sm transition">🎙️ ভয়েস দিয়ে বিস্তারিত বলুন</button>
        <textarea id="description" placeholder="বিস্তারিত লিখুন..." class="w-full bg-slate-800 p-3 rounded-xl border border-slate-700 text-white h-20"></textarea>
        
        <input type="file" id="fileInput" accept="image/*" class="w-full text-slate-400 text-xs">
        
        <button type="submit" id="submitBtn" class="w-full bg-red-600 hover:bg-red-700 py-3 rounded-xl font-bold text-white shadow-lg transition-all">রিপোর্ট পাঠান</button>
    </form>

    <!-- জরুরি কল বাটন -->
    <a href="tel:999" class="block w-full text-center bg-blue-600 hover:bg-blue-700 py-3 rounded-xl font-bold text-white mt-6 shadow-lg">📞 জরুরি প্রয়োজনে ৯৯৯ কল করুন</a>
</div>

<script>
    // ভয়েস টু টেক্সট
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'bn-BD';
    document.getElementById('voiceBtn').onclick = () => recognition.start();
    recognition.onresult = (e) => document.getElementById('description').value = e.results[0][0].transcript;

    document.getElementById('reportForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "লোকেশন নেয়া হচ্ছে...";

        navigator.geolocation.getCurrentPosition(async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
            
            // ঠিকানা খোঁজা
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=bn`);
            const data = await res.json();
            const address = data.display_name || "ঠিকানা পাওয়া যায়নি";
            document.getElementById('location').value = address;

            // টেলিগ্রাম বোট
            const text = `🚨 *নতুন রিপোর্ট*\n\n*ধরন:* ${document.getElementById('category').value}\n*এলাকা:* ${address}\n*বর্ণনা:* ${document.getElementById('description').value}\n\n🔗 [সরাসরি ম্যাপে দেখুন](${mapLink})`;
            const formData = new FormData();
            formData.append('chat_id', '8766925591');
            formData.append('caption', text);
            formData.append('parse_mode', 'Markdown');
            if(document.getElementById('fileInput').files[0]) formData.append('photo', document.getElementById('fileInput').files[0]);

            const botUrl = document.getElementById('fileInput').files[0] ? 'sendPhoto' : 'sendMessage';
            await fetch(`https://api.telegram.org/bot8868947145:AAFjXyUwInMs1bGzhEvV9Oyla1eGkaKbbVg/${botUrl}`, {method: 'POST', body: formData});
            
            alert("সফলভাবে পাঠানো হয়েছে!");
            location.reload();
        });
    });
</script>
</body>
</html>
