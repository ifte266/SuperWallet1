<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>নিরাপত্তা পোর্টাল | Smart Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: white; min-height: 100vh; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="flex flex-col items-center py-6 px-4">

<div class="w-full max-w-sm glass p-6 rounded-3xl shadow-2xl">
    <h1 class="text-2xl font-bold text-center text-red-500 mb-6">🚨 নিরাপত্তা পোর্টাল</h1>
    
    <form id="reportForm" class="space-y-4">
        <select id="category" class="w-full bg-slate-800 p-3 rounded-xl border border-slate-700 text-white">
            <option>চুরি / ছিনতাই</option>
            <option>মাদক কেনাবেচা</option>
            <option>ইভটিজিং</option>
            <option>সন্দেহভাজন কার্যক্রম</option>
        </select>
        
        <label class="flex items-center space-x-2 text-sm text-red-400">
            <input type="checkbox" id="urgent" class="w-4 h-4 accent-red-600">
            <span>জরুরি অবস্থা (Emergency)</span>
        </label>

        <input type="text" id="location" placeholder="এলাকার নাম (অটো আসবে)" required class="w-full bg-slate-800 p-3 rounded-xl border border-slate-700 text-white">
        
        <button type="button" id="voiceBtn" class="w-full bg-slate-700 hover:bg-slate-600 py-2 rounded-xl text-sm transition">🎙️ ভয়েস দিয়ে বিস্তারিত বলুন</button>
        <textarea id="description" placeholder="বিস্তারিত লিখুন..." class="w-full bg-slate-800 p-3 rounded-xl border border-slate-700 text-white h-20"></textarea>
        
        <input type="file" id="fileInput" accept="image/*" class="w-full text-slate-400 text-xs">
        
        <button type="submit" id="submitBtn" class="w-full bg-red-600 hover:bg-red-700 py-3 rounded-xl font-bold text-white shadow-lg transition-all">রিপোর্ট পাঠান</button>
    </form>
</div>

<script>
    // ভয়েস টু টেক্সট লজিক
    const voiceBtn = document.getElementById('voiceBtn');
    const desc = document.getElementById('description');
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'bn-BD';

    voiceBtn.onclick = () => {
        voiceBtn.innerText = "রেকর্ডিং হচ্ছে...";
        recognition.start();
    };

    recognition.onresult = (event) => {
        desc.value = event.results[0][0].transcript;
        voiceBtn.innerText = "🎙️ ভয়েস দিয়ে বিস্তারিত বলুন";
    };

    // মূল সাবমিট লজিক
    document.getElementById('reportForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "লোকেশন নেয়া হচ্ছে...";

        navigator.geolocation.getCurrentPosition(async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;

            // ঠিকানা অটো-ফিল (Nominatim)
            let address = "এলাকা অটোমেটিক পাওয়া যায়নি";
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=bn`);
                const data = await res.json();
                if(data.address) address = `${data.address.suburb || ''}, ${data.address.city || ''}`;
            } catch(e) {}

            document.getElementById('location').value = address;
            btn.innerText = "পাঠানো হচ্ছে...";

            // টেলিগ্রাম বোট সেন্ড লজিক
            const formData = new FormData();
            formData.append('chat_id', '8766925591');
            const file = document.getElementById('fileInput').files[0];
            const botToken = "8868947145:AAFjXyUwInMs1bGzhEvV9Oyla1eGkaKbbVg";
            const text = `🚨 *নতুন রিপোর্ট*\n\n*ধরন:* ${document.getElementById('category').value}\n*এলাকা:* ${address}\n*বর্ণনা:* ${desc.value}`;

            if(file) {
                formData.append('photo', file);
                formData.append('caption', text);
                await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {method: 'POST', body: formData});
            } else {
                await fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=8766925591&text=${encodeURIComponent(text)}&parse_mode=Markdown`);
            }
            alert("সফলভাবে পাঠানো হয়েছে!");
            location.reload();
        }, () => {
            alert("লোকেশন পারমিশন অন করুন!");
            btn.disabled = false;
            btn.innerText = "রিপোর্ট পাঠান";
        }, {enableHighAccuracy: true});
    });
</script>
</body>
</html>
